<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leads Bridge</title>
    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/images/Logo.png" />

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- tailwind cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome cdn -->
    <script
      src="https://kit.fontawesome.com/288dc013f9.js"
      crossorigin="anonymous"
    ></script>

    <style>
      .primary {
        color: #ffa500;
      }
      body {
        font-family: "Oswald", sans-serif;
      }

      .customBtn {
        border-right: 4px solid black;
        border-bottom: 4px solid black;
      }
    </style>
  </head>

  <body>
    <main>
      <section class="lg:min-h-screen bg-gradient-to-b from-white to-[#FFEAC3]">
        <!-- navbar -->
        <div class="navbar container mx-auto flex justify-between items-center">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <i class="fa-solid fa-bars-staggered"></i>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a class="primary">Services</a></li>
                <li><a>About</a></li>
                <li><a>Contact</a></li>
              </ul>
            </div>
            <a class="btn btn-ghost text-xl">
              <img src="/images/Logo.png" alt="logo" />
            </a>
          </div>
          <div class="flex justify-center items-center gap-12">
            <div class="hidden lg:flex">
              <ul class="menu menu-horizontal text-base px-1">
                <li><a class="primary">Services</a></li>
                <li><a>About</a></li>
                <li><a>Contact</a></li>
              </ul>
            </div>
            <div class="">
              <a
                class="btn btn-sm lg:btn-md customBtn rounded-full font-medium text-xs lg:text-sm text-white bg-[#FFA500]"
                >Book a Free Consultation</a
              >
            </div>
          </div>
        </div>
        <!-- hero -->
        <div class=" relative w-11/12 py-10 sm:py-20 lg:py-28 mx-auto flex flex-col items-center justify-center gap-4">
          <div class=" z-40 flex items-center justify-center gap-2">
            <img class="w-10 h-auto" src="/images/aBadge.png" alt="badge" />
            <p class="text-base">Your Full-Service <span class="primary">Amazon Partner</span></p>
          </div>
          <h1 class="text-4xl sm:text-[45px] md:text-[55px] lg:text-[65px] xl:text-[70px] z-40 mt-4 leading-tight font-semibold text-center">Turn Your Amazon Struggles <br class="hidden xl:block"> into Success—Save Time,<br> <span class="primary">Maximize Profits!</span></h1>
          <div class="mt-5 lg:mt-8 z-40">
              <a
                class="btn px-3 lg:px-6 btn-md lg:btn-lg customBtn rounded-full font-medium text-xs lg:text-sm text-white bg-[#FFA500]"
                >Book a Free Consultation</a
              >
            </div>

            <!-- absolute cards -->
         <div class="absolute lg:top-1/2 bottom-0 right-0 z-0">
            <img class="w-40 md:w-60 lg:w-auto" src="/images/review.png" alt="review">
         </div>
         <div class="absolute bottom-0 lg:top-1/2 left-0 z-0">
            <img class="w-40 md:w-60 lg:w-auto" src="/images/totalContainer.png" alt="total">
         </div>
        </div>
        
      </section>
    </main>
  </body>
</html>
